{{- /* Social Links - Hugo v0.157.0+ */ -}}
<div class="social-icon-outer">
    <div class="social-icon-container">
        {{- range $name, $url := .Site.Params.Social -}}
            {{- with $url -}}
                {{- $iconPath := printf "icons/social/%s" $name -}}
                <a href="{{ $url }}" 
                   aria-label="Follow us on {{ title $name }}" 
                   rel="noopener noreferrer" 
                   target="_blank">
                    {{- partial $iconPath $ -}}
                </a>
            {{- end -}}
        {{- end -}}
    </div>
</div>
