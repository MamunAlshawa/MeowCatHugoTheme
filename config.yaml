# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  MeowCatHugoTheme Configuration - Hugo v0.157.0+                             ║
# ║  ⚠️ HUGO v0.157.0+ ONLY - NO BACKWARD COMPATIBILITY                          ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

# ───────────────────────────────────────────────────────────────────────────────
#  REQUIRED: BASIC SITE SETTINGS
# ───────────────────────────────────────────────────────────────────────────────
baseURL: "https://your-domain.com/"
languageCode: en-us
title: "Your Site Title"
theme: MeowCatHugoTheme

# ───────────────────────────────────────────────────────────────────────────────
#  REQUIRED: LANGUAGES (Keep at least one, remove unused)
# ───────────────────────────────────────────────────────────────────────────────
languages:
  en:
    languageName: English
    languageCode: en-us
    weight: 1
    params:
      description: "Your site description"
      title: "Your Site Title"
  
  # Turkish - Uncomment if needed
  # tr:
  #   languageName: Türkçe
  #   languageCode: tr
  #   weight: 2
  #   params:
  #     description: "Site açıklaması"
  #     title: "Site Başlığı"
  
  # Arabic - Uncomment if needed (RTL support)
  # ar:
  #   languageName: العربية
  #   languageCode: ar
  #   weight: 3
  #   rtl: true
  #   params:
  #     description: "وصف الموقع"
  #     title: "عنوان الموقع"

# ───────────────────────────────────────────────────────────────────────────────
#  REQUIRED: TAXONOMIES
# ───────────────────────────────────────────────────────────────────────────────
taxonomies:
  tag: tags
  category: categories

# ───────────────────────────────────────────────────────────────────────────────
#  REQUIRED: PERMALINKS
# ───────────────────────────────────────────────────────────────────────────────
permalinks:
  post: /:year/:month/:slug/
  authors: /authors/:slug/

# ───────────────────────────────────────────────────────────────────────────────
#  REQUIRED: CONTENT SETTINGS
# ───────────────────────────────────────────────────────────────────────────────
content:
  preserveTaxonomyNames: true
  defaultContentLanguage: en
  defaultContentLanguageInSubdir: false

# ───────────────────────────────────────────────────────────────────────────────
#  REQUIRED: MARKUP (Markdown & Syntax Highlighting)
# ───────────────────────────────────────────────────────────────────────────────
markup:
  goldmark:
    extensions:
      definitionList: true
      footnote: true
      linkify: true
      linkifyProtocol: https
      strikethrough: true
      table: true
      taskList: true
    parser:
      autoHeadingID: true
      autoHeadingIDType: github
      attribute:
        block: true
        title: true
    renderer:
      hardWraps: false
      unsafe: false
      xhtml: false

  highlight:
    codeFences: true
    guessSyntax: false
    lineNos: false
    lineNumbersInTable: false
    noClasses: false
    style: monokai
    tabWidth: 4

  tableOfContents:
    startLevel: 2
    endLevel: 3
    ordered: false

ignoreLogs:
  - "warning-goldmark-raw-html"

# ───────────────────────────────────────────────────────────────────────────────
#  REQUIRED: OUTPUTS
# ───────────────────────────────────────────────────────────────────────────────
outputs:
  home:
    - HTML
    - RSS
    - JSON
  page:
    - HTML
  section:
    - HTML
    - RSS
  taxonomy:
    - HTML
    - RSS

# ───────────────────────────────────────────────────────────────────────────────
#  REQUIRED: PAGINATION
# ───────────────────────────────────────────────────────────────────────────────
pagination:
  pagerSize: 10
  path: page
  disableAliases: false

# ───────────────────────────────────────────────────────────────────────────────
#  REQUIRED: IMAGE PROCESSING
# ───────────────────────────────────────────────────────────────────────────────
imaging:
  resampleFilter: Lanczos
  quality: 80
  anchor: smart

# ───────────────────────────────────────────────────────────────────────────────
#  REQUIRED: SITE PARAMETERS
# ───────────────────────────────────────────────────────────────────────────────
params:
  # Author (REQUIRED)
  author:
    name: "Your Name"
    email: "your.email@example.com"
  
  # Site Logo - Navbar & Favicon (REQUIRED)
  logo: "images/profile-01.jpeg"
  
  # Author Avatar - Bio & Article bylines (OPTIONAL - falls back to page avatar)
  authorAvatar: "images/author-avatar.jpeg"
  
  # Show bio section (REQUIRED)
  showBio: true
  
  # Author page URL (REQUIRED - for SEO)
  singleAuthorUrl: "/authors/your-slug"
  
  # Social Media (OPTIONAL - leave empty "" to hide)
  social:
    twitter: ""      # e.g., "yourname" → https://twitter.com/yourname
    github: ""       # e.g., "yourname" → https://github.com/yourname
    linkedin: ""     # e.g., "in/yourname" → https://linkedin.com/in/yourname
    facebook: ""
    instagram: ""
    medium: ""
    dribbble: ""
    youtube: ""
    unsplash: ""
    patreon: ""
    paypal: ""
  
  # SEO (REQUIRED for JSON-LD)
  seo:
    default_image: "/images/default-og.jpg"  # 1200x630px recommended
    jsonld: true
    debug: false
    site_name: "Your Site Name"

# ───────────────────────────────────────────────────────────────────────────────
#  REQUIRED: BUILD SETTINGS (Hugo v0.157.0+)
# ───────────────────────────────────────────────────────────────────────────────
build:
  buildStats:
    enable: true
    disableResourceMeta: false
  cacheBusters:
    - source: assets/.*\.(js|css|scss)$
      target: $1

# ───────────────────────────────────────────────────────────────────────────────
#  REQUIRED: SECURITY (SCSS compilation needs dart-sass-embedded)
# ───────────────────────────────────────────────────────────────────────────────
security:
  exec:
    allow:
      - ^dart-sass-embedded$
    osEnv:
      - (?i)^(PATH|PATHEXT|APPDATA|TMP|TEMP|TERM)$
  funcs:
    getenv:
      - ^HUGO_
      - ^CI$
  http:
    methods:
      - (?i)GET|POST
    urls:
      - .*

# ───────────────────────────────────────────────────────────────────────────────
#  REQUIRED: PERFORMANCE
# ───────────────────────────────────────────────────────────────────────────────
enableEmoji: false
enableRobotsTXT: true
enableGitInfo: false

# ═══════════════════════════════════════════════════════════════════════════════
#  SETUP CHECKLIST:
# ═══════════════════════════════════════════════════════════════════════════════
#  □ Change baseURL to your domain
#  □ Update title
#  □ Remove unused languages (keep at least one)
#  □ Set author.name and author.email
#  □ Add logo image to assets/images/ and update path
#  □ Set singleAuthorUrl to match your author page slug
#  □ Add social media usernames (optional)
#  □ Add default-og.jpg for SEO (optional but recommended)
#  □ Test: hugo server --buildDrafts
# ═══════════════════════════════════════════════════════════════════════════════
